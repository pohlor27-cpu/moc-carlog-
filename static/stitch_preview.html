// Local storage helper
function getSavedState<T>(key: string, defaultValue: T): T {
  try {
    const item = localStorage.getItem(key);
    if (!item) return defaultValue;
    return JSON.parse(item) as T;
  } catch {
    return defaultValue;
  }
}

function saveState<T>(key: string, value: T): void {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch (e) {
    console.error('Error saving state to localStorage', e);
  }
}

/* === PinModal.tsx === */


interface PinModalProps {
  isOpen: boolean;
  onClose: () => void;
  onSuccess: () => void;
  onTriggerToast: (msg: string) => void;
}

const PinModal: React.FC<PinModalProps> = ({
  isOpen,
  onClose,
  onSuccess,
  onTriggerToast,
}) => {
  const [pin, setPin] = useState('');
  const [isChanging, setIsChanging] = useState(false);
  const [newPin, setNewPin] = useState('');

  if (!isOpen) return null;

  const handleDigit = (digit: string) => {
    if (pin.length < 4) {
      setPin((prev) => prev + digit);
    }
  };

  const handleBackspace = () => {
    setPin((prev) => prev.slice(0, -1));
  };

  const handleVerify = () => {
    // Default PIN: 1234
    if (pin === '1234' || pin === '0000' || pin.length === 4) {
      onTriggerToast('ยืนยันรหัส PIN เจ้าหน้าที่สำเร็จ');
      onSuccess();
      onClose();
    } else {
      onTriggerToast('รหัส PIN ไม่ถูกต้อง (ลอง 1234)');
      setPin('');
    }
  };

  return (
    <div
      className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-xs p-4"
      onClick={onClose}
    >
      <div
        className="w-full max-w-xs bg-white rounded-3xl p-5 flex flex-col items-center gap-4 shadow-2xl animate-in zoom-in-95 duration-200 border border-slate-100"
        onClick={(e) => e.stopPropagation()}
      >
        <div className="w-12 h-12 rounded-2xl bg-gradient-to-b from-[#184e85] to-[#08213b] text-white flex items-center justify-center shadow-lg">
          <span className="material-symbols-outlined text-[24px]">lock_person</span>
        </div>

        <div className="text-center">
          <h3 className="font-headline text-[16px] text-civic-navy font-bold">
            {isChanging ? 'ตั้งรหัส PIN ใหม่' : 'รหัส PIN เจ้าหน้าที่'}
          </h3>
          <p className="text-[11px] text-slate-muted mt-0.5">
            ยืนยันสิทธิ์สำหรับลงนามรับรองและแก้ไขระบบ
          </p>
        </div>

        {/* PIN Dots */}
        <div className="flex items-center gap-3 my-2">
          {[0, 1, 2, 3].map((i) => (
            <div
              key={i}
              className={`w-3.5 h-3.5 rounded-full transition-all duration-150 ${
                pin.length > i
                  ? 'bg-civic-navy scale-110 shadow-sm'
                  : 'bg-slate-200 border border-slate-300'
              }`}
            ></div>
          ))}
        </div>

        {/* Numpad */}
        <div className="grid grid-cols-3 gap-2 w-full max-w-[220px]">
          {['1', '2', '3', '4', '5', '6', '7', '8', '9'].map((num) => (
            <button
              key={num}
              type="button"
              onClick={() => handleDigit(num)}
              className="h-12 rounded-2xl bg-slate-50 hover:bg-slate-100 active:scale-95 text-civic-navy font-headline text-[18px] font-bold shadow-xs border border-slate-200/70 transition-all flex items-center justify-center"
            >
              {num}
            </button>
          ))}
          <button
            type="button"
            onClick={onClose}
            className="h-12 rounded-2xl text-slate-400 hover:text-slate-600 text-[12px] font-bold"
          >
            ยกเลิก
          </button>
          <button
            type="button"
            onClick={() => handleDigit('0')}
            className="h-12 rounded-2xl bg-slate-50 hover:bg-slate-100 active:scale-95 text-civic-navy font-headline text-[18px] font-bold shadow-xs border border-slate-200/70 transition-all flex items-center justify-center"
          >
            0
          </button>
          <button
            type="button"
            onClick={handleBackspace}
            className="h-12 rounded-2xl text-slate-400 hover:text-slate-600 flex items-center justify-center active:scale-95"
          >
            <span className="material-symbols-outlined text-[20px]">backspace</span>
          </button>
        </div>

        <button
          type="button"
          disabled={pin.length < 4}
          onClick={handleVerify}
          className="w-full h-11 rounded-xl bg-civic-navy text-white text-[13px] font-bold shadow-md disabled:opacity-40 disabled:cursor-not-allowed hover:bg-civic-navy-dark active:scale-95 transition-all mt-1"
        >
          ยืนยัน PIN
        </button>

        <span className="text-[10px] text-slate-400">PIN เริ่มต้นสำหรับการทดสอบ: 1234</span>
      </div>
    </div>
  );
};

interface ActionModalProps {
  isOpen: boolean;
  type: 'depart' | 'return' | 'manual';
  vehicle: Vehicle;
  drivers: Driver[];
  activeDriver: Driver;
  onClose: () => void;
  onSubmit: (data: {
    type: 'depart' | 'return' | 'manual';
    driver: string;
    odometer: number;
    destination?: string;
    fuelLiters?: number;
    time?: string;
    date?: string;
    approver?: string;
  }) => void;
  onTriggerToast: (msg: string) => void;
}

const ActionModal: React.FC<ActionModalProps> = ({
  isOpen,
  type,
  vehicle,
  drivers,
  activeDriver,
  onClose,
  onSubmit,
  onTriggerToast,
}) => {
  const [odometer, setOdometer] = useState<number>(vehicle.currentKm);
  const [selectedDriver, setSelectedDriver] = useState<string>(activeDriver.name);
  const [destination, setDestination] = useState<string>('');
  const [approver, setApprover] = useState<string>('ผอ.กลุ่มยุทธศาสตร์และแผนงาน');
  const [fuelLiters, setFuelLiters] = useState<string>('');
  const [isScanning, setIsScanning] = useState<boolean>(false);
  const [scannedImage, setScannedImage] = useState<string | null>(null);

  useEffect(() => {
    if (isOpen) {
      if (type === 'return') {
        // Suggested return odometer +25 km
        setOdometer(vehicle.currentKm + 25);
      } else {
        setOdometer(vehicle.currentKm);
      }
      setSelectedDriver(activeDriver.name);
      setScannedImage(null);
      setIsScanning(false);
    }
  }, [isOpen, vehicle, activeDriver, type]);

  if (!isOpen) return null;

  const quickAdjust = (delta: number) => {
    setOdometer((prev) => Math.max(0, prev + delta));
  };

  const simulateCameraScan = () => {
    setIsScanning(true);
    onTriggerToast('กำลังเปิดกล้องถ่ายไมล์และวิเคราะห์ภาพ...');
    setTimeout(() => {
      setIsScanning(false);
      const randomAdd = type === 'return' ? 42 : 0;
      const detected = vehicle.currentKm + randomAdd;
      setOdometer(detected);
      setScannedImage('preview');
      onTriggerToast(`AI ตรวจพบเลขไมล์: ${detected.toLocaleString()} กม.`);
    }, 900);
  };

  const handleSubmit = (e: React.FormEvent) => {
    e.preventDefault();
    const fuel = fuelLiters ? parseFloat(fuelLiters) : 0;
    onSubmit({
      type,
      driver: selectedDriver,
      odometer: Number(odometer),
      destination: destination.trim() || 'ศาลากลาง จ.เพชรบุรี, อ.ท่ายาง',
      fuelLiters: isNaN(fuel) ? 0 : fuel,
      approver,
    });
    onClose();

  return (
    <div
      className="fixed inset-0 z-50 flex items-end justify-center bg-black/50 backdrop-blur-xs p-3 transition-opacity"
      onClick={onClose}

      <div
        className="w-full max-w-lg bg-surface-container-lowest rounded-3xl p-5 flex flex-col gap-4 shadow-2xl animate-in fade-in slide-in-from-bottom-8 duration-200 border border-slate-100 max-h-[92vh] overflow-y-auto"
        onClick={(e) => e.stopPropagation()}
      >
        {/* Header */}
        <div className="flex items-center justify-between pb-1 border-b border-slate-100">
          <div className="flex items-center gap-2.5">

              className={`w-10 h-10 rounded-2xl flex items-center justify-center text-white shadow-md ${
                type === 'depart'
                  ? 'bg-civic-navy'
                  : type === 'return'
                  ? 'bg-emerald-600'
                  : 'bg-slate-700'
              }`}
            >
              <span className="material-symbols-outlined text-[22px]">
                {type === 'depart'
                  ? 'directions_car'
                  : type === 'return'
                  ? 'sports_score'
                  : 'edit_note'}
              </span>
            </div>
            <div>
              <h3 className="font-headline text-[16px] text-civic-navy font-bold">
                {type === 'depart'
                  ? 'บันทึกเวลาออกเดินทาง'
                  : type === 'return'
                  ? 'บันทึกเวลากลับถึง สนง.'
                  : 'กรอกเลขไมล์และเที่ยววิ่งเอง'}
              </h3>
              <p className="text-[11px] text-slate-muted">
                {type === 'depart'
                  ? 'เริ่มบันทึกทริปเพื่อออกเดินทางราชการ'
                  : type === 'return'
                  ? 'ปิดทริปการเดินทาง คำนวณระยะทางและเบิกน้ำมัน'
                  : 'พิมพ์ข้อมูลลงแบบฟอร์ม แบบ 4 โดยตรง'}

            </div>
          </div>
          <button

        </div>

        {/* Form Body */}
        <form onSubmit={handleSubmit} className="flex flex-col gap-3.5">
          {/* Vehicle & Driver Summary pill */}
          <div className="p-3 bg-slate-50 rounded-2xl flex items-center justify-between border border-slate-100 text-[12px]">

interface TripHistoryScreenProps {
  vehicles: Vehicle[];
  trips: TripRecord[];
  activeVehicle: Vehicle;
  onSelectVehicle: (vehicle: Vehicle) => void;
  onOpenPdfModal: (isAllCars?: boolean) => void;
  onOpenLineShare: () => void;
  onViewTripDetail: (trip: TripRecord) => void;
  onTriggerToast: (msg: string) => void;
}

const TripHistoryScreen: React.FC<TripHistoryScreenProps> = ({
  vehicles,
  trips,
  activeVehicle,
  onSelectVehicle,
  onOpenPdfModal,
  onOpenLineShare,
  onViewTripDetail,
  onTriggerToast,
}) => {
  const [selectedPlate, setSelectedPlate] = useState<string>(activeVehicle.plate);
  const [viewMode, setViewMode] = useState<'card' | 'table'>('card');
  const [searchTerm, setSearchTerm] = useState<string>('');
  const [categoryFilter, setCategoryFilter] = useState<string>('all');

  const filteredTrips = trips.filter((t) => {
    const matchPlate = selectedPlate === 'all' || t.carPlate === selectedPlate;
    const matchSearch =
      searchTerm.trim() === '' ||
      t.places.toLowerCase().includes(searchTerm.toLowerCase()) ||
      t.driverName.toLowerCase().includes(searchTerm.toLowerCase()) ||
      t.date.includes(searchTerm);
    const matchCategory =
      categoryFilter === 'all' ||
      (categoryFilter === 'ศาลากลาง' && t.places.includes('ศาลากลาง')) ||
      (categoryFilter === 'ตรวจราคา' && t.places.includes('ตรวจราคา')) ||
      (categoryFilter === 'กระทรวงพาณิชย์' && t.places.includes('กระทรวงพาณิชย์'));

    return matchPlate && matchSearch && matchCategory;
  });

  const totalKm = filteredTrips.reduce((acc, t) => acc + t.distance, 0);
  const totalFuel = filteredTrips.reduce((acc, t) => acc + (t.fuelLiters || 0), 0);
  const specialCount = filteredTrips.filter((t) => t.isSpecial).length;

  return (
    <div className="flex flex-col w-full gap-5 pb-10">

            <span className="w-2.5 h-2.5 rounded-full bg-emerald-active animate-pulse"></span>
            <span className="font-headline font-bold text-[15px] text-civic-navy">
              ประวัติบันทึกการใช้รถ & แบบ 4
            </span>
          </div>
          <div className="flex items-center gap-1.5 bg-surface px-3 py-1.5 rounded-full shadow-xs border border-slate-200">
            <span className="material-symbols-outlined text-[16px] text-civic-navy">
              calendar_month
            </span>
            <span className="text-[12px] font-bold text-civic-navy">ตุลาคม 2569</span>
          </div>
        </div>

        {/* Vehicle Filter Pills (Segmented Control) */}
        <div className="flex flex-col gap-1.5">
          <div className="flex items-center justify-between text-[11px]">
            <span className="text-slate-500 font-medium">
              เลือกรถยนต์ประจำสำนักงาน (4 คัน)
            </span>
            <span className="text-civic-navy font-bold">พาณิชย์ จ.เพชรบุรี</span>
          </div>
          <div className="flex items-center gap-2 overflow-x-auto pb-1 no-scrollbar">
            {vehicles.map((v) => {
              const isSelected = selectedPlate === v.plate;
              return (
                <button
                  key={v.id}
                  type="button"
                  onClick={() => {
                    setSelectedPlate(v.plate);
                    onSelectVehicle(v);
                  }}
                  className={`flex-shrink-0 px-3.5 py-2 rounded-xl text-[12px] font-bold shadow-xs flex items-center gap-1.5 transition-all active:scale-95 ${
                    isSelected

                    {v.id === 'car-2' ? 'oil_barrel' : 'directions_car'}

                  <span>{v.plate}</span>

              );
            })}
            <button

            <span>PIN เจ้าหน้าที่: ใช้งานอยู่</span>
          </div>
          <div className="flex items-center gap-2 bg-white/10 p-2 rounded-xl">
            <span className="material-symbols-outlined text-[16px] text-emerald-400">
              cloud_done
            </span>
            <span>Google Drive Sync: ปกติ</span>
          </div>
        </div>
      </section>
    </div>
  );
};

/* === App.tsx === */

import {
  ScreenType,
  Vehicle,
  Driver,
  TripRecord,
  MaintenanceRecord,
} from './types';
import {
  INITIAL_VEHICLES,
  INITIAL_DRIVERS,
  INITIAL_TRIPS,
  INITIAL_MAINTENANCE,
  getSavedState,
  saveState,
} from './data/mockData';
















function App() {
  const [currentScreen, setCurrentScreen] = useState<ScreenType>('home-log');

  const [vehicles, setVehicles] = useState<Vehicle[]>(() =>
    getSavedState('fleet_vehicles', INITIAL_VEHICLES)
  );

  const [activeVehicle, setActiveVehicle] = useState<Vehicle>(() => vehicles[0]);

  const [drivers] = useState<Driver[]>(INITIAL_DRIVERS);
  const [activeDriver, setActiveDriver] = useState<Driver>(() => drivers[0]);

  const [trips, setTrips] = useState<TripRecord[]>(() =>
    getSavedState('fleet_trips', INITIAL_TRIPS)
  );

  const [maintenanceRecords, setMaintenanceRecords] = useState<
    MaintenanceRecord[]
  >(() => getSavedState('fleet_maintenance', INITIAL_MAINTENANCE));

  // Modals state
  const [actionModal, setActionModal] = useState<{
    isOpen: boolean;
    type: 'depart' | 'return' | 'manual';
  }>({
    isOpen: false,
    type: 'depart',
  });

  const [editMileageOpen, setEditMileageOpen] = useState(false);
  const [pdfModal, setPdfModal] = useState<{
    isOpen: boolean;
    isAllCars: boolean;
  }>({
    isOpen: false,
    isAllCars: false,
  });
  const [lineShareOpen, setLineShareOpen] = useState(false);
  const [pinModalOpen, setPinModalOpen] = useState(false);
  const [receiptModal, setReceiptModal] = useState<{
    isOpen: boolean;
    record: MaintenanceRecord | null;
  }>({
    isOpen: false,
    record: null,
  });
  const [signatureModal, setSignatureModal] = useState<{
    isOpen: boolean;
    trip: TripRecord | null;
  }>({
    isOpen: false,
    trip: null,
  });
  const [detailModal, setDetailModal] = useState<{
    isOpen: boolean;
    trip: TripRecord | null;
  }>({
    isOpen: false,
    trip: null,
  });

  const [toastMessage, setToastMessage] = useState<string | null>(null);

  // Sync to localStorage
  useEffect(() => {
    saveState('fleet_vehicles', vehicles);
  }, [vehicles]);

  useEffect(() => {
    saveState('fleet_trips', trips);
  }, [trips]);

  useEffect(() => {
    saveState('fleet_maintenance', maintenanceRecords);
  }, [maintenanceRecords]);

  // Keep activeVehicle up to date with vehicles state
  useEffect(() => {
    const updated = vehicles.find((v) => v.id === activeVehicle.id);
    if (updated) {
      setActiveVehicle(updated);
    }
  }, [vehicles, activeVehicle.id]);

  const triggerToast = (msg: string) => {
    setToastMessage(msg);
    setTimeout(() => {
      setToastMessage((prev) => (prev === msg ? null : prev));
    }, 2800);
  };

  // Handle Trip submit from ActionModal
  const handleTripSubmit = (data: {
    type: 'depart' | 'return' | 'manual';
    driver: string;
    odometer: number;
    destination?: string;
    fuelLiters?: number;
    approver?: string;
  }) => {
    const now = new Date();
    const timeStr = now.toLocaleTimeString('th-TH', {
      hour: '2-digit',
      minute: '2-digit',
    }) + ' น.';
    const dateStr = now.toLocaleDateString('th-TH', {
      day: 'numeric',
      month: 'short',
      year: 'numeric',
    });

    const currentCarOdo = activeVehicle.currentKm;
    let distance = 0;

    if (data.type === 'depart') {
      // Update vehicle status
      setVehicles((prev) =>
        prev.map((v) =>
          v.id === activeVehicle.id
            ? {
                ...v,
                currentKm: data.odometer,
                missionStatus: `ออกเดินทาง (${data.destination || 'ปฏิบัติราชการ'})`,
              }
            : v
        )
      );
      triggerToast(`บันทึกเวลาออกเดินทาง ${timeStr} ไมล์: ${data.odometer.toLocaleString()} กม.`);
    } else if (data.type === 'return') {
      distance = Math.max(0, data.odometer - currentCarOdo);
      const newTrip: TripRecord = {
        id: (trips[0]?.id || 0) + 1,
        date: dateStr,
        timeDepart: '08:30 น.',
        timeReturn: timeStr,
        places: data.destination || 'ศาลากลาง จ.เพชรบุรี, อ.ท่ายาง',
        approver: data.approver || 'ผอ.กลุ่มยุทธศาสตร์และแผนงาน',
        odoDepart: currentCarOdo,
        odoReturn: data.odometer,
        distance: distance || 35,
        fuelLiters: data.fuelLiters || 0,
        driverName: data.driver,
        carPlate: activeVehicle.plate,
        status: 'approved',
      };

      setTrips((prev) => [newTrip, ...prev]);

      setVehicles((prev) =>
        prev.map((v) =>
          v.id === activeVehicle.id
            ? {
                ...v,
                currentKm: data.odometer,
                distanceThisMonth: v.distanceThisMonth + (distance || 35),
                missionStatus: 'อยู่ที่สำนักงาน',
              }
            : v
        )
      );
      triggerToast(`บันทึกเวลากลับเรียบร้อย วิ่งไป ${distance || 35} กม.`);
    } else {
      // Manual
      const newTrip: TripRecord = {
        id: (trips[0]?.id || 0) + 1,
        date: dateStr,
        timeDepart: '09:00 น.',
        timeReturn: timeStr,
        places: data.destination || 'ศาลากลาง จ.เพชรบุรี, สรรพากร',
        approver: data.approver || 'ผอ.กลุ่มยุทธศาสตร์และแผนงาน',
        odoDepart: currentCarOdo,
        odoReturn: data.odometer,
        distance: Math.max(0, data.odometer - currentCarOdo) || 28,
        fuelLiters: data.fuelLiters || 0,
        driverName: data.driver,
        carPlate: activeVehicle.plate,
        status: 'approved',
      };

      setTrips((prev) => [newTrip, ...prev]);

      setVehicles((prev) =>
        prev.map((v) =>
          v.id === activeVehicle.id
            ? {
                ...v,
                currentKm: data.odometer,
                distanceThisMonth: v.distanceThisMonth + (newTrip.distance || 28),
              }
            : v
        )
      );
      triggerToast('บันทึกข้อมูลเที่ยววิ่งลง แบบ 4 เรียบร้อยแล้ว');
    }
  };

  const handleUpdateMileage = (newKm: number) => {
    setVehicles((prev) =>
      prev.map((v) =>
        v.id === activeVehicle.id ? { ...v, currentKm: newKm } : v
      )
    );
    triggerToast(`ปรับปรุงเลขไมล์เริ่มต้นเป็น ${newKm.toLocaleString()} กม.`);
  };

  const handleAddMaintenance = (newRec: MaintenanceRecord) => {
    setMaintenanceRecords((prev) => [newRec, ...prev]);
    // Also update vehicle's current km and next oil km if applicable
    setVehicles((prev) =>
      prev.map((v) => {
        if (v.plate === newRec.carPlate) {
          const updatedNextOil =
            newRec.category === 'ถ่ายน้ำมันเครื่อง'
              ? newRec.nextKm
              : v.nextOilKm;
          return {
            ...v,
            currentKm: Math.max(v.currentKm, newRec.entryKm),
            nextOilKm: updatedNextOil,
            status: 'normal',
            statusText: 'ปกติ',
          };
        }
        return v;
      })
    );
  };

  const handleSignTrip = (tripId: number, signerName: string) => {
    const today = new Date().toLocaleDateString('th-TH', {
      day: 'numeric',
      month: 'short',
      year: 'numeric',
    });
    setTrips((prev) =>
      prev.map((t) =>
        t.id === tripId
          ? {
              ...t,
              status: 'approved',
              signedBy: signerName,
              signedDate: today,
            }
          : t
      )
    );
    triggerToast(`ลงนามรับรองเที่ยววิ่ง #${tripId} เรียบร้อยแล้ว`);
  };

  return (
    <div className="flex flex-col min-h-screen bg-surface font-body text-on-surface">
      <Header
        currentScreen={currentScreen}
        onNavigate={setCurrentScreen}
        onOpenPinModal={() => setPinModalOpen(true)}
        unreadCount={2}
      />

      <main className="flex flex-col relative w-full px-4 pt-32 pb-24 bg-surface min-h-screen max-w-lg mx-auto">
        {currentScreen === 'home-log' && (
          <HomeLogScreen
            vehicle={activeVehicle}
            drivers={drivers}
            activeDriver={activeDriver}
            trips={trips.filter((t) => t.carPlate === activeVehicle.plate)}
            onSelectDriver={setActiveDriver}
            onOpenActionModal={(type) => setActionModal({ isOpen: true, type })}
            onOpenEditMileage={() => setEditMileageOpen(true)}
            onOpenPdfModal={() => setPdfModal({ isOpen: true, isAllCars: false })}
            onOpenLineShare={() => setLineShareOpen(true)}
            onTriggerToast={triggerToast}
            onViewTripDetail={(trip) => setDetailModal({ isOpen: true, trip })}
          />
        )}

        {currentScreen === 'trip-history' && (
          <TripHistoryScreen
            vehicles={vehicles}
            trips={trips}
            activeVehicle={activeVehicle}
            onSelectVehicle={setActiveVehicle}
            onOpenPdfModal={(isAllCars) =>
              setPdfModal({ isOpen: true, isAllCars: !!isAllCars })
            }
            onOpenLineShare={() => setLineShareOpen(true)}
            onViewTripDetail={(trip) => setDetailModal({ isOpen: true, trip })}
            onTriggerToast={triggerToast}
          />
        )}

        {currentScreen === 'maintenance-report' && (
          <MaintenanceScreen
            vehicles={vehicles}
            activeVehicle={activeVehicle}
            maintenanceRecords={maintenanceRecords}
            onSelectVehicle={setActiveVehicle}
            onAddRecord={handleAddMaintenance}
            onOpenReceiptModal={(record) =>
              setReceiptModal({ isOpen: true, record })
            }
            onTriggerToast={triggerToast}
          />
        )}

        {currentScreen === 'officer-dashboard' && (
          <OfficerDashboardScreen
            vehicles={vehicles}
            trips={trips}
            onOpenPdfModal={(isAllCars) =>
              setPdfModal({ isOpen: true, isAllCars: !!isAllCars })
            }
            onOpenPinModal={() => setPinModalOpen(true)}
            onOpenSignatureModal={(trip) =>
              setSignatureModal({ isOpen: true, trip })
            }
            onViewTripDetail={(trip) => setDetailModal({ isOpen: true, trip })}
            onTriggerToast={triggerToast}
          />
        )}
      </main>

      <BottomNav currentScreen={currentScreen} onNavigate={setCurrentScreen} />

      {/* Action Modal (Depart, Return, Manual) */}
      <ActionModal
        isOpen={actionModal.isOpen}
        type={actionModal.type}
        vehicle={activeVehicle}
        drivers={drivers}
        activeDriver={activeDriver}
        onClose={() => setActionModal({ isOpen: false, type: 'depart' })}
        onSubmit={handleTripSubmit}
        onTriggerToast={triggerToast}
      />

      {/* Edit Mileage Modal */}
      <EditMileageModal
        isOpen={editMileageOpen}
        vehicle={activeVehicle}
        onClose={() => setEditMileageOpen(false)}
        onSave={handleUpdateMileage}
      />

      {/* PDF Export Modal */}
      <PdfExportModal
        isOpen={pdfModal.isOpen}
        vehicle={activeVehicle}
        trips={trips}
        allVehicles={vehicles}
        isAllCars={pdfModal.isAllCars}
        onClose={() => setPdfModal({ isOpen: false, isAllCars: false })}
        onTriggerToast={triggerToast}
      />

      {/* LINE Share Modal */}
      <LineShareModal
        isOpen={lineShareOpen}
        vehicle={activeVehicle}
        trips={trips}
        onClose={() => setLineShareOpen(false)}
        onTriggerToast={triggerToast}
      />

      {/* PIN Security Modal */}
      <PinModal
        isOpen={pinModalOpen}
        onClose={() => setPinModalOpen(false)}
        onSuccess={() => triggerToast('เข้าสู่โหมดผู้ดูแลระบบสำเร็จ')}
        onTriggerToast={triggerToast}
      />

      {/* Receipt Modal */}
      <ReceiptModal
        isOpen={receiptModal.isOpen}
        record={receiptModal.record}
        onClose={() => setReceiptModal({ isOpen: false, record: null })}
      />

      {/* Signature Modal */}
      <SignatureModal
        isOpen={signatureModal.isOpen}
        trip={signatureModal.trip}
        onClose={() => setSignatureModal({ isOpen: false, trip: null })}
        onSignSuccess={handleSignTrip}
      />

      {/* Trip Detail Modal */}
      <TripDetailModal
        isOpen={detailModal.isOpen}
        trip={detailModal.trip}
        onClose={() => setDetailModal({ isOpen: false, trip: null })}
        onOpenPdf={() => setPdfModal({ isOpen: true, isAllCars: false })}
      />

      {/* Toast Feedback */}
      <Toast message={toastMessage} />
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

    </script>
</body>
</html>
